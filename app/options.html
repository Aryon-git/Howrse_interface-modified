<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Options</title>
    <style>
        body { background-color: #cbc86b; min-width: 250px;}
        h1 {font-size: large;}
    </style>
</head>
<body>
    <h1>Howrse interface modifications</h1>
    <form id="optionsForm">
        <label>
        <input type="checkbox" id="optRemoveHeaderBlur" />
            remove header blur effect
        </label>
        <br/> 
        <label>
        <input type="checkbox" id="optRemoveEventsBlur" />
            remove the blurry background from the events popup
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optReduceSubmenuHeight" />
            reduce space between submenu items
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optHideHeaderBackButton" />
            hide back button in the header
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optSwapHorseBackground" />
            swap background of horses without Helios' Ray to the more subtle colored one
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optBlockAds" />
            remove the advertisement banner 
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optHideAlternativeLoginMethods" />
            hide alternative login methods (google/facebook)
        </label>
        <br/> 
        <br/>
        <label>
        <input type="checkbox" id="optHideOlympNotif" />
            hide red olymp notification
        </label>
        <br/> 
        <label>
        <input type="checkbox" id="optHideEventNotif" />
            hide red event notification
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optHidePassesNotif" />
            hide red passes notification
        </label>
        <br/>
        <br/>
        <label>
            red notification notification
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optHideNotifNotif" />
            hide 
        </label>
        <label>
        <input type="checkbox" id="optModifyNotifNotif" />
            modify
        </label>
        <br/>
        <label>
            red private message notification
        </label>
        <br/>
        <label>
        <input type="checkbox" id="optHideMessagesNotif" />
            hide 
        </label>
        <label>
        <input type="checkbox" id="optModifyMessagesNotif" />
            modify 
        </label>
        <br/> 
        <br/>
        <button type="button" id="saveBtn">Save</button>
    </form>
    <script src="optionPage.js"></script>
</body>
</html>
